<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crea tu personaje</title>
<style>
  :root { color-scheme: dark; --fondo: #15161a; --panel: rgba(22, 23, 28, .92); --borde: #2b2d35; --texto: #ece8e1; --suave: #9a978f; --acento: #d9b27c; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); overflow: hidden; font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #panel { position: fixed; top: 0; left: 0; bottom: 0; width: min(360px, 92vw); background: var(--panel); border-right: 1px solid var(--borde);
           display: flex; flex-direction: column; }
  #panel header { padding: 14px 16px 8px; }
  #panel h1 { margin: 0 0 2px; font-size: 18px; font-weight: 600; }
  #panel header p { margin: 0; color: var(--suave); font-size: 12px; }
  #pestanas { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 12px; border-bottom: 1px solid var(--borde); }
  #pestanas button { background: none; border: 1px solid var(--borde); color: var(--suave); border-radius: 14px; padding: 4px 10px; cursor: pointer; font: inherit; }
  #pestanas button[aria-selected="true"] { color: #111; background: var(--acento); border-color: var(--acento); }
  #controles { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }
  .fila { margin: 10px 0; }
  .fila label { display: flex; justify-content: space-between; color: var(--suave); font-size: 12px; margin-bottom: 3px; }
  .fila label span:last-child { color: var(--texto); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acento); }
  #pie { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--borde); flex-wrap: wrap; }
  #pie button, #vistas button { background: #24262d; border: 1px solid var(--borde); color: var(--texto); border-radius: 6px; padding: 7px 10px; cursor: pointer; font: inherit; }
  #pie button.principal { background: var(--acento); color: #111; border-color: var(--acento); font-weight: 600; }
  #vistas { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; }
  #carga { position: fixed; inset: 0; display: grid; place-items: center; background: var(--fondo); font-size: 16px; padding: 0 16px; text-align: center; }
  #carga[hidden] { display: none; }
  .tonos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .tonos button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .tonos button[aria-pressed="true"] { border-color: var(--acento); }
  .opciones { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .opciones button { background: #24262d; border: 1px solid var(--borde); color: var(--texto); border-radius: 14px; padding: 5px 10px; cursor: pointer; font: inherit; }
  .opciones button[aria-pressed="true"] { color: #111; background: var(--acento); border-color: var(--acento); }
  @media (max-width: 700px) { #panel { top: auto; height: 46vh; width: 100%; border-right: 0; border-top: 1px solid var(--borde); } #vistas { top: 8px; right: 8px; } }
</style>
<script type="importmap">
{ "imports": { "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.23.3/build/playcanvas.mjs" } }
</script>
</head>
<body>
<canvas id="lienzo"></canvas>
<aside id="panel">
  <header><h1>Crea tu personaje</h1><p>Cuerpo y cara de Anny (Apache 2.0, datos de MakeHuman CC0), con ojos, cejas, pestañas y ropa de MakeHuman. El pelo de verdad, más adelante.</p></header>
  <nav id="pestanas" role="tablist"></nav>
  <div id="controles"></div>
  <div id="pie">
    <button id="azar">Al azar</button><button id="video">La del vídeo</button><button id="reiniciar">Restablecer</button><button id="guardar">Guardar</button>
    <button id="calle" class="principal">Guardar y salir a la calle</button><button id="chica">Jugar con la chica</button>
  </div>
</aside>
<div id="vistas"><button data-vista="cuerpo">Cuerpo</button><button data-vista="cara">Cara</button><button data-anim="quieto">Quieto</button><button data-anim="andar">Andar</button></div>
<div id="carga">Cargando el personaje…</div>
<script type="module" src="./src/editor.js"></script>
</body>
</html>
