<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crea tu personaje</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/archivo@5.2.8/wdth.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.2.8/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.2.8/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5.2.8/400-italic.css">
<style>
  /* el aspecto de la web de 388 Pueblos, como la calle (docs/estilo.md): la noche azulada, la cal y el naranja de sodio; Archivo,
     Instrument Serif en cursiva y Geist Mono en mayúsculas; pastillas */
  :root { color-scheme: dark; --fondo: #070a14; --panel: rgba(13, 19, 38, .94); --borde: rgba(186, 198, 255, .16); --texto: #eef0ec; --suave: #9ba4c8; --acento: #ffa94d; --acento-2: #ffcf91; --tinta: #0c1122;
          --f-display: "Archivo Variable", "Archivo", "Helvetica Neue", Arial, sans-serif; --f-serif: "Instrument Serif", "Iowan Old Style", Georgia, serif; --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); overflow: hidden; font: 14px/1.45 var(--f-display); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #panel { position: fixed; top: 0; left: 0; bottom: 0; width: min(360px, 92vw); background: var(--panel); border-right: 1px solid var(--borde);
           display: flex; flex-direction: column; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  #panel header { padding: 16px 16px 10px; }
  #panel h1 { margin: 0 0 6px; font: 800 24px/.95 var(--f-display); font-variation-settings: "wdth" 118; letter-spacing: -.03em; text-transform: uppercase; }
  #panel header p { margin: 0; color: var(--suave); font-size: 12px; }
  #pestanas { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 12px; border-bottom: 1px solid var(--borde); }
  #pestanas button { background: none; border: 1px solid var(--borde); color: var(--suave); border-radius: 999px; padding: 5px 10px; cursor: pointer; font: 400 10.5px/1.2 var(--f-mono); letter-spacing: .09em; text-transform: uppercase; }
  #pestanas button[aria-selected="true"] { color: var(--tinta); background: var(--acento); border-color: var(--acento); }
  #controles { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }
  .fila { margin: 10px 0; }
  .fila label { display: flex; justify-content: space-between; color: var(--suave); font-size: 12px; margin-bottom: 3px; }
  .fila label span:last-child { color: var(--texto); font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acento); }
  #pie { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--borde); flex-wrap: wrap; }
  #pie button, #vistas button { background: rgba(255, 255, 255, .04); border: 1px solid var(--borde); color: var(--texto); border-radius: 999px; padding: 8px 12px; cursor: pointer;
                                font: 400 10.5px/1.2 var(--f-mono); letter-spacing: .09em; text-transform: uppercase; }
  #pie button:hover, #vistas button:hover { border-color: rgba(255, 255, 255, .4); }
  #vistas button { background: rgba(7, 10, 20, .62); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #pie button.principal { background: var(--acento); color: var(--tinta); border-color: var(--acento); font-weight: 500; }
  #pie button.principal:hover { background: var(--acento-2); border-color: var(--acento-2); }
  #vistas { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; }
  #carga { position: fixed; inset: 0; display: grid; place-items: center; background: var(--fondo); padding: 0 16px; text-align: center;
           font: 400 11px/1.3 var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--suave); }
  #carga[hidden] { display: none; }
  .tonos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .tonos button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .tonos button[aria-pressed="true"] { border-color: var(--acento); }
  .opciones { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .opciones button { background: rgba(255, 255, 255, .04); border: 1px solid var(--borde); color: var(--texto); border-radius: 999px; padding: 6px 11px; cursor: pointer; font: inherit; font-size: 12px; }
  .opciones button[aria-pressed="true"] { color: var(--tinta); background: var(--acento); border-color: var(--acento); }
  @media (max-width: 700px) { #panel { top: auto; height: 46vh; width: 100%; border-right: 0; border-top: 1px solid var(--borde); } #vistas { top: 8px; right: 8px; } }
</style>
<script type="importmap">
{ "imports": { "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.23.3/build/playcanvas.mjs" } }
</script>
</head>
<body>
<canvas id="lienzo"></canvas>
<aside id="panel">
  <header><h1>Crea tu personaje</h1><p>Cuerpo y cara de Anny (Apache 2.0, datos de MakeHuman CC0), con ojos, cejas, pestañas y ropa de MakeHuman. El pelo de verdad, más adelante.</p></header>
  <nav id="pestanas" role="tablist"></nav>
  <div id="controles"></div>
  <div id="pie">
    <button id="azar">Al azar</button><button id="video">La del vídeo</button><button id="reiniciar">Restablecer</button><button id="guardar">Guardar</button>
    <button id="calle" class="principal">Guardar y salir a la calle</button><button id="chica">Jugar con la chica</button>
  </div>
</aside>
<div id="vistas"><button data-vista="cuerpo">Cuerpo</button><button data-vista="cara">Cara</button><button data-anim="quieto">Quieto</button><button data-anim="andar">Andar</button></div>
<div id="carga">Cargando el personaje…</div>
<script type="module" src="./src/editor.js"></script>
</body>
</html>
