<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Guareña, el juego de 388 Pueblos: la calle Malfeitos y el pueblo entero. Versión de prueba.">
<meta name="theme-color" content="#070a14">
</head>
<body>
<title>Calle Malfeitos · Guareña · 388 Pueblos</title>
<!-- (las letras de la web de 388 Pueblos —Archivo, Instrument Serif y Geist Mono—, de Fontsource en jsDelivr, no de Google;
     sin ellas, las del sistema: docs/estilo.md) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/archivo@5.2.8/wdth.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.2.8/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.2.8/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5.2.8/400-italic.css">
<style>
  /* el aspecto de la web de 388 Pueblos (css/landing.css de la web; docs/estilo.md): la noche azulada, la cal y el naranja
     de las farolas de sodio; Archivo ancho para los títulos, Instrument Serif en cursiva y Geist Mono en mayúsculas para
     los rótulos, en pastillas de cristal oscuro. El lienzo ocupa toda la ventana y encima van rótulos pequeños */
  :root { color-scheme: dark; --noche: #070a14; --noche-2: #151d36; --cal: #eef0ec; --niebla: #9ba4c8; --sodio: #ffa94d; --sodio-2: #ffcf91; --tinta: #0c1122;
          --linea: rgba(186, 198, 255, .16); --velo: rgba(7, 10, 20, .62); --fondo: var(--noche); --texto: var(--cal);
          --f-display: "Archivo Variable", "Archivo", "Helvetica Neue", Arial, sans-serif; --f-serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
          --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace; }
  html, body { margin: 0; height: 100%; background: var(--noche); color: var(--cal); overflow: hidden; font: 14px/1.45 var(--f-display); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud, #ayuda { position: fixed; padding: 7px 12px; background: var(--velo); border: 1px solid var(--linea); border-radius: 999px; font: 400 11px/1.4 var(--f-mono); letter-spacing: .09em;
                 text-transform: uppercase; font-variant-numeric: tabular-nums; pointer-events: none; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #hud { top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); max-width: calc(100% - 20px); box-sizing: border-box; color: var(--niebla);
         white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  #ayuda { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); width: fit-content;
           max-width: calc(100% - 20px); box-sizing: border-box; color: var(--cal); opacity: .9; }
  @media (max-width: 760px) { #hud, #ayuda { font-size: 10px; letter-spacing: .07em; } #ayuda { border-radius: 14px; } }
  #carga { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(120% 80% at 50% 110%, var(--noche-2), var(--noche) 65%); padding-inline: 20px; text-align: center; }
  #carga[hidden] { display: none; }
  #carga .kicker { display: inline-flex; gap: .8em; align-items: center; font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--sodio); }
  #carga .kicker::before, #carga .kicker::after { content: ""; width: 1.6em; height: 1px; background: currentColor; }
  #carga h1 { margin: 18px 0 0; font: 800 clamp(40px, 9vw, 104px)/.88 var(--f-display); font-variation-settings: "wdth" 118; letter-spacing: -.04em; text-transform: uppercase; text-wrap: balance; }
  #carga .serif { display: block; margin-top: 8px; font: italic 400 clamp(22px, 3.4vw, 34px)/1.1 var(--f-serif); color: var(--niebla); }
  #carga-estado { display: inline-block; margin-top: 30px; padding: 8px 14px; border: 1px solid var(--linea); border-radius: 999px; background: rgba(255, 255, 255, .04);
                  font: 400 11px/1.3 var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--niebla); font-variant-numeric: tabular-nums; }
</style>
<script>window.ESCENA_POR_DEFECTO = 'malfeitos_gris';</script>
<script type="importmap">
{
  "imports": {
    "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.23.3/build/playcanvas.mjs",
    "playcanvas/scripts/": "https://cdn.jsdelivr.net/npm/playcanvas@2.23.3/scripts/"
  }
}
</script>
<canvas id="lienzo"></canvas>
<div id="hud">cargando…</div>
<div id="ayuda">WASD andar · Shift correr · Espacio saltar · Ratón mirar · Rueda acercar</div>
<div id="carga"><div><span class="kicker" id="carga-sitio">388 Pueblos · Guareña</span><h1 id="carga-titulo">Calle Malfeitos</h1><span class="serif" id="carga-sub">una calle de Guareña</span><span id="carga-estado">Cargando…</span></div></div>
<!-- (sin el botón «Crea tu personaje»: el usuario lo quitó el 10-11-2026; el editor se abre con …#personaje) -->
<style>#creditos { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); padding: 7px 12px; background: var(--velo, rgba(7, 10, 20, .62)); color: var(--cal, #eef0ec); border: 1px solid var(--linea, rgba(186, 198, 255, .16)); border-radius: 999px; font: 400 11px/1.4 var(--f-mono, ui-monospace, Menlo, monospace); letter-spacing: .09em; text-transform: uppercase; text-decoration: none; opacity: .85; z-index: 5; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #creditos:hover, #creditos:focus-visible { opacity: 1; border-color: rgba(255, 255, 255, .4); outline: none; }
  @media (max-width: 760px) { #creditos { bottom: calc(58px + env(safe-area-inset-bottom, 0px)); } }</style>
<a id="creditos" href="./creditos.txt" target="_blank" rel="noopener">Créditos</a>
<script>if (location.hash === '#personaje') document.getElementById('creditos')?.remove();</script>
<script type="module" src="./src/entrada.js"></script>
</body>
</html>
